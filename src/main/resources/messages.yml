# ========================================
# CXTeleport - Mensagens
# ========================================
# Placeholders disponiveis:
# {player} - Nome do jogador
# {target} - Nome do jogador alvo
# {home} - Nome da casa
# {warp} - Nome da warp
# {world} - Nome do mundo
# {x}, {y}, {z} - Coordenadas
# {cooldown} - Tempo de cooldown
# {seconds} - Segundos
# {cost} - Custo
# {balance} - Saldo do jogador
# {limit} - Limite
# {count} - Quantidade
# {page} - Pagina atual
# {pages} - Total de paginas
# {prefix} - Prefixo do plugin
# {time} - Tempo formatado
# {line} - Quebra de linha

prefix: "&8[&bCXTeleport&8] &r"

# Mensagens gerais
general:
  no-permission: "&cVoce nao tem permissao para isso."
  player-not-found: "&cJogador nao encontrado ou offline."
  player-only: "&cEste comando so pode ser executado por jogadores."
  cooldown: "&cAguarde &e{cooldown} &csegundos antes de usar novamente."
  no-money: "&cVoce nao tem dinheiro suficiente. Custo: &e${cost}&c. Saldo: &e${balance}"
  paid: "&aVoce pagou &e${cost} &apara usar este comando."
  reloaded: "&aConfiguracoes recarregadas com sucesso."
  teleport-cancelled: "&cTeleporte cancelado!"
  teleport-cancelled-move: "&cTeleporte cancelado! Voce se moveu."
  teleport-cancelled-damage: "&cTeleporte cancelado! Voce tomou dano."
  teleport-warmup: "&eTeleportando em &b{seconds} &esegundos... Nao se mova!"
  teleport-success: "&aTeleportado com sucesso!"
  teleport-unsafe: "&cNao foi possivel encontrar um local seguro para teleportar."
  combat-blocked: "&cVoce esta em combate! Aguarde &e{seconds} &csegundos."
  jail-blocked: "&cVoce esta preso e nao pode se teleportar!"
  warmup-bar-title: "&bTeleportando..."

# Sistema de TPA
tpa:
  sent: "&aSolicitacao de teleporte enviada para &e{target}&a."
