  received-here: "&e{player} &adeseja que voce va ate ele. Use &e/tpaceitar &aou &e/tprecusar&a."
  accepted: "&aSolicitacao de teleporte aceita!"
  accepted-target: "&e{player} &aaceitou sua solicitacao!"
  denied: "&cSolicitacao de teleporte recusada."
  denied-target: "&e{player} &crecusou sua solicitacao."
  cancelled: "&aSolicitacoes pendentes canceladas."
  expired: "&cSolicitacao de teleporte expirada."
  expired-target: "&cSua solicitacao para &e{player} &cexpirou."
  no-pending: "&cVoce nao tem solicitacoes pendentes."
  no-pending-from: "&cNenhuma solicitacao pendente de &e{player}&c."
  self-teleport: "&cVoce nao pode teleportar para si mesmo!"
  already-sent: "&cVoce ja enviou uma solicitacao para &e{player}&c."
  too-many: "&cVoce tem muitas solicitacoes pendentes. Aguarde."
  blocked-by-target: "&c{target} bloqueou solicitacoes de teleporte."
  target-toggled-off: "&c{target} desativou solicitacoes de teleporte."
  target-toggled-off-here: "&c{target} desativou solicitacoes para vir ate ele."
  toggle-on: "&aSolicitacoes de teleporte &bativadas&a."
  toggle-off: "&cSolicitacoes de teleporte &4desativadas&c."
  toggle-here-on: "&aSolicitacoes para vir ate voce &bativadas&a."
  toggle-here-off: "&cSolicitacoes para vir ate voce &4desativadas&c."
  auto-on: "&aAutoaceitacao &bativada&a."
  auto-off: "&cAutoaceitacao &4desativada&c."
  blocked-player: "&cVoce bloqueou solicitacoes de &e{player}&c."
  unblocked-player: "&aVoce desbloqueou solicitacoes de &e{player}&a."
  already-blocked: "&c{player} ja esta bloqueado."
  not-blocked: "&c{player} nao esta bloqueado."
  history-title: "&8Historico de TPA - Pagina {page}/{pages}"
  history-entry: "&7[{time}] &e{player} &7-> &e{target} &8({status})"
  history-empty: "&cNenhuma entrada no historico."

# Sistema de Casas
homes:
  teleported: "&aTeleportado para casa &e{home}&a!"
  set: "&aCasa &e{home} &adefinida com sucesso!"
  deleted: "&aCasa &e{home} &aremovida com sucesso!"
  not-found: "&cCasa &e{home} &cnao encontrada."
  limit-reached: "&cVoce atingiu o limite de &e{limit} &ccasas!"
  list-title: "&8Suas Casas &7({count}/{limit})"
  list-entry: "&e{home} &7- &f{world}, {x}, {y}, {z}"
  list-empty: "&cVoce nao tem nenhuma casa definida."
  already-exists: "&cVoce ja tem uma casa com o nome &e{home}&c."
  gui-title: "&8Suas Casas"
  cost-set: "&aVoce pagou &e${cost} &apara definir esta casa."
  cost-teleport: "&aVoce pagou &e${cost} &apara teleportar."

# Sistema de Warps
warps:
  teleported: "&aTeleportado para warp &e{warp}&a!"
  created: "&aWarp &e{warp} &acriada com sucesso!"
  deleted: "&aWarp &e{warp} &aremovida com sucesso!"
  not-found: "&cWarp &e{warp} &cnao encontrada."
  already-exists: "&cWarp &e{warp} &cja existe."
  list-title: "&8Warps &7({count})"
  list-entry: "&e{warp} &7- &f{world}, {x}, {y}, {z}"
  list-empty: "&cNenhuma warp definida."
  no-permission-warp: "&cVoce nao tem permissao para usar esta warp."
  cost-create: "&aVoce pagou &e${cost} &apara criar esta warp."
  cost-use: "&aVoce pagou &e${cost} &apara usar esta warp."

# Sistema de Spawn
spawn:
  teleported: "&aTeleportado para o spawn!"
  teleported-other: "&aTeleportado &e{player} &apara o spawn!"
  set: "&aSpawn definido com sucesso!"
  not-set: "&cSpawn nao definido. Use /setspawn para definir."
  first-login: "&aBem-vindo! Teleportado para o spawn."

# Sistema de Retorno
back:
  teleported: "&aRetornado a localizacao anterior!"
  no-location: "&cNenhuma localizacao anterior registrada."
  death-back: "&aRetornado ao local da morte!"
  death-location-saved: "&eUse &b/voltar &epara retornar ao local da morte."

# Sistema de RTP
rtp:
  teleported: "&aTeleportado aleatoriamente para &e{world}, {x}, {y}, {z}&a!"
  searching: "&eProcurando local seguro..."
  not-found: "&cNao foi possivel encontrar um local seguro apos {count} tentativas."
  world-not-allowed: "&cRTP nao esta disponivel neste mundo."
  queue:
    joined: "&aVoce entrou na fila de RTP. Posicao: &e{position}"
