    already-in: "&cVoce ja esta na fila de RTP."
    not-in: "&cVoce nao esta na fila de RTP."
    processing: "&eProcessando seu RTP..."
  zone:
    teleported: "&aTeleportado para a zona &e{zone}&a!"
    countdown: "&eTeleportando em &b{seconds} &esegundos..."
    not-found: "&cZona &e{zone} &cnao encontrada."

# Sistema de Prisao
jail:
  jailed: "&cVoce foi preso por &e{player}&c!"
  unjailed: "&aVoce foi libertado por &e{player}&a!"
  already-jailed: "&c{player} ja esta preso."
  not-jailed: "&c{player} nao esta preso."
  jailed-player: "&cVoce prendeu &e{player}&c."
  unjailed-player: "&aVoce libertou &e{player}&a."
  no-location: "&cLocal da prisao nao definido."

# Comandos Admin
admin:
  tp-success: "&aTeleportado para &e{player}&a."
  tphere-success: "&aPuxou &e{player} &aate voce."
  tppos-success: "&aTeleportado para &e{x}, {y}, {z} &ano mundo &e{world}&a."
  tpup-success: "&aTeleportado &e{blocks} &ablocos para cima."
  tpall-success: "&aTeleportou todos os jogadores ate voce."
  tplog-title: "&8Historico de Teletransportes - Pagina {page}/{pages}"
  tplog-entry: "&7[{time}] &e{player} &7-> &e{target} &8({type})"
  stats:
    title: "&8======= &bCXTeleport Stats &8======="
    total-teleports: "&7Total de teleportes: &e{count}"
    total-homes: "&7Total de casas: &e{count}"
    total-warps: "&7Total de warps: &e{count}"
    total-tpa: "&7Total de solicitacoes TPA: &e{count}"
    total-rtp: "&7Total de RTPs: &e{count}"
    total-jailed: "&7Jogadores presos: &e{count}"
    uptime: "&7Tempo online: &e{time}"
  help:
    title: "&8======= &bCXTeleport Ajuda &8======="
    help-entry: "&e/{command} &7- {description}"

# Protecao PvP
pvp:
  protection-start: "&aProtecao PvP ativada por &e{seconds} &asegundos!"
  protection-end: "&cSua protecao PvP acabou!"
  protection-cancelled: "&cProtecao PvP cancelada por ataque!"
